name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test

      - name: OpenSpec (strict validation, no finished change left unarchived)
        run: pnpm spec:check

      # Neither step needs a database: drizzle-kit compares the schema with drizzle/ snapshots.
      - name: Check migration history
        run: pnpm db:check
      - name: Check that migrations match the schema
        run: |
          pnpm exec drizzle-kit generate --name=ci_drift_check
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::src/server/db/schema changed without a migration. Run 'pnpm db:generate' and commit drizzle/."
            git status --porcelain -- drizzle
            exit 1
          fi

      # Building does not require database credentials: env is validated lazily at runtime.
      - run: pnpm build

  e2e:
    name: End-to-end tests (Android viewport)
    runs-on: ubuntu-latest
    services:
      # Dedicated test database; E2E fixtures wipe it between tests.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doctor_handbook_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d doctor_handbook_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/doctor_handbook_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # Plain PostgreSQL: also proves the migrations run outside Supabase (no anon role).
      - name: Apply migrations to the test database
        run: pnpm db:migrate
        env:
          DIRECT_DATABASE_URL: ${{ env.E2E_DATABASE_URL }}

      # The iPhone project needs WebKit; run it locally with `pnpm test:e2e`.
      - run: pnpm exec playwright test --project=android

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
