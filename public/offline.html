<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Đang mất mạng · Doctor Handbook</title>
    <!-- Offline page (spec app-install): precached by /sw.js, shown when a page cannot load.
         Self-contained on purpose: no Next.js bundle, no patient data. -->
    <style>
      :root {
        --bg: #f6f7fa;
        --fg: #111827;
        --muted: #525c70;
        --primary: #1e40af;
        --primary-fg: #ffffff;
        --ring: #1e40af;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d121c;
          --fg: #e9edf5;
          --muted: #9ba5b8;
          --primary: #8ea8ff;
          --primary-fg: #0d121c;
          --ring: #8ea8ff;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        width: 100%;
        max-width: 360px;
        display: grid;
        justify-items: center;
        gap: 14px;
      }
      h1 {
        margin: 6px 0 0;
        font-size: 1.35rem;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      button {
        width: 100%;
        height: 48px;
        margin-top: 6px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: var(--primary-fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--ring);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="96" height="96" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#1E3A8A" />
        <rect x="15" y="10" width="34" height="44" rx="5" fill="#FFFFFF" />
        <rect x="15" y="10" width="7" height="44" rx="3" fill="#C7D2FE" />
        <rect x="25" y="28" width="20" height="8" rx="2" fill="#D92D20" />
        <rect x="31" y="22" width="8" height="20" rx="2" fill="#D92D20" />
      </svg>
      <h1>Đang mất mạng</h1>
      <p>Ghi chú đang gõ vẫn được giữ trên máy. Khi có mạng, mở lại để dùng tiếp.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
